name: jalotsav_panel
description: "Touch panel for a PT100 temperature alarm: two ESP32-C3 nodes over Bluetooth LE (FlutterCon India 2026 demo)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  universal_ble: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
